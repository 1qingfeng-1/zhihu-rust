[package]
name = "zhihu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
zhihu-api = { path = "../zhihu-api" }
zhihu-store = { path = "../zhihu-store" }
zhihu-types = { path = "../zhihu-types" }
zhihu-recommend = { path = "../zhihu-recommend" }
anyhow = { workspace = true }
async-channel = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "fs", "sync"] }
regex = "1.13.1"
md-5 = "0.10"
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
