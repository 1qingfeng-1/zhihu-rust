[package]
name = "zhihu-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
gpui-kit = { workspace = true }
jieba-rs = { workspace = true }
log = "0.4"
ratex-gpui = { workspace = true }
qrcode = "0.14.1"
zhihu-content = { path = "../zhihu-content" }
zhihu-core = { path = "../zhihu-core" }
zhihu-recommend = { path = "../zhihu-recommend" }
zhihu-types = { path = "../zhihu-types" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
gpui-mobile = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
dirs = "6"
