name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ZHIHU_VERSION: ${{ github.ref_name }}
  ZHIHU_VERSION_CODE: ${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
      - name: Build native library
        run: |
          cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build -p zhihu-mobile --release
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-all android/app/src/main/jniLibs/arm64-v8a/libzhihu_mobile.so
          rm -f android/app/src/main/jniLibs/arm64-v8a/libgpui_mobile.so
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Decode release keystore
        env:
          ZHIHU_KEYSTORE_BASE64: ${{ secrets.ZHIHU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ZHIHU_KEYSTORE_BASE64" ]; then
            echo "$ZHIHU_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ZHIHU_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret; falling back to the debug key."
          fi
      - name: Assemble release APK
        working-directory: android
        env:
          ZHIHU_KEYSTORE_PASSWORD: ${{ secrets.ZHIHU_KEYSTORE_PASSWORD }}
          ZHIHU_KEY_ALIAS: ${{ secrets.ZHIHU_KEY_ALIAS }}
          ZHIHU_KEY_PASSWORD: ${{ secrets.ZHIHU_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/zhihu-${ZHIHU_VERSION}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/zhihu-*-android-arm64.apk

  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: zhihu-desktop-windows-x64.zip
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-latest
            artifact: zhihu-desktop-linux-x64.tar.gz
            rustflags: ""
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop binary
        run: cargo build --release -p zhihu-desktop
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/release/zhihu-desktop.exe `
            -DestinationPath "${{ runner.temp }}/${{ matrix.artifact }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf "${{ runner.temp }}/${{ matrix.artifact }}" \
            -C target/release zhihu-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: dist/*
