name: build
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  build-rust:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libasound2-dev libvulkan-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Check code format
        run: cargo fmt -- --check
      - name: Check the package for errors
        run: cargo check --all
      - name: Lint rust sources
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings
      - name: Execute rust tests
        if: github.event_name != 'pull_request'
        run: cargo nextest run --workspace --all-features --profile ci --no-tests warn
      - name: Generate coverage report
        if: github.event_name == 'pull_request'
        run: cargo llvm-cov nextest --workspace --all-features --profile ci --html --output-dir ./target/coverage --ignore-filename-regex "tests/.*"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: rust-coverage-report
          path: ./target/coverage
